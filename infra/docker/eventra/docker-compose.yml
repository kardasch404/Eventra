services:
  mongodb:
    image: mongo:7.0
    container_name: eventra-mongodb
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - eventra-network

  redis:
    image: redis:7-alpine
    container_name: eventra-redis
    restart: unless-stopped
    command: redis-server --requirepass "redis_pass"
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - eventra-network

  backend:
    build:
      context: ../../..
      dockerfile: infra/docker/eventra/Dockerfile
    container_name: eventra-backend
    restart: unless-stopped
    env_file:
      - ../../../backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - mongodb
      - redis
    networks:
      - eventra-network

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: eventra-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
    ports:
      - '3001:3000'
    depends_on:
      - backend
    networks:
      - eventra-network

  mongo-express:
    image: mongo-express:latest
    container_name: eventra-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin_pass
    ports:
      - '8081:8081'
    depends_on:
      - mongodb
    networks:
      - eventra-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  eventra-network:
    driver: bridge
